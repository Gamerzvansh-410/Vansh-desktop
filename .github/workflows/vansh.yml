```yaml
name: Vansh Desktop CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test Vansh Desktop Assistant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install fastapi
          pip install uvicorn
          pip install edge-tts
          pip install SpeechRecognition
          pip install playsound3

      - name: Install PyAudio dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-pyaudio
          pip install pyaudio

      - name: Verify project imports
        run: |
          python -c "from Vansh.config import WAKE_WORDS; print('Config loaded successfully')"
          python -c "from Vansh.skills import handle_command; print('Skills loaded successfully')"

      - name: Test wake word configuration
        run: |
          python -c "from Vansh.config import WAKE_WORDS; assert 'vansh' in WAKE_WORDS; print('Wake word test passed')"

      - name: Test command processing
        run: |
          python -c "from Vansh.skills import handle_command; print(handle_command('what is the time'))"
          python -c "from Vansh.skills import handle_command; print(handle_command('what is the date'))"

      - name: Test FastAPI server
        run: |
          python -c "from server import app; print('FastAPI server loaded successfully')"

      - name: CI completed
        run: echo "Vansh Desktop CI passed successfully!"
```
